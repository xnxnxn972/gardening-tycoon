<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Treasure Traitors — Main Screen</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
  { "imports": { "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2" } }
  </script>
</head>
<body class="sea-deco">
  <div id="app"></div>

  <script type="module">
    import QRCode from 'https://esm.sh/qrcode@1.5.3';
    import * as net from './js/net.js';
    import * as E from './js/engine.js';

    const code = net.roomFromUrl();
    const app = document.getElementById('app');
    const DEMO = new URL(location.href).searchParams.get('demo');

    let state = null;          // authoritative game state (host is the referee)
    let lockedIds = new Set();  // players who submitted this round (for READY tags)
    let tick = null;
    let resolving = false;

    // Per-island flavor + emoji (cosmetic only — logic uses the map graph).
    const ISLAND_EMOJI = {
      'Skull Rock': '💀', 'Rum Bay': '🍾', 'Gold Cove': '🏛️', 'Cannon Cay': '💣',
      'Shark Reef': '🦈', 'Monkey Isle': '🐒', 'Shipwreck Point': '⚓', 'Treasure Atoll': '🗿',
    };

    function esc(s) { return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
    function secsLeft() { return state ? Math.max(0, Math.ceil((state.deadline - Date.now()) / 1000)) : 0; }

    // ---- a little pirate ship drawn in SVG, tinted by player color ----
    function shipPaths(color) {
      return `
        <path d="M-22 6 L22 6 L16 20 L-16 20 Z" fill="#7a4a22" stroke="#5b3415" stroke-width="1.5"/>
        <rect x="-22" y="1.5" width="44" height="6" rx="3" fill="#9a6a3a"/>
        <rect x="-1.2" y="-26" width="2.6" height="32" fill="#5b3b1a"/>
        <path d="M2 -24 L2 2 L22 -2 Q15 -12 2 -24 Z" fill="${color}"/>
        <path d="M-2 -22 L-2 1 L-18 -2 Q-11 -11 -2 -22 Z" fill="${color}" opacity="0.82"/>
        <path d="M2 -27 L13 -25 L2 -22 Z" fill="#15171a"/>`;
    }
    function shipMiniSVG(color, w = 38) {
      return `<svg width="${w}" viewBox="-26 -32 52 56" aria-hidden="true">${shipPaths(color)}</svg>`;
    }
    function shipOnMap(x, y, color, name, damaged) {
      const w = Math.max(58, name.length * 9 + 20);
      return `
        <g transform="translate(${x},${y}) scale(0.82)">
          ${shipPaths(color)}
          ${damaged ? '<text x="0" y="-3" text-anchor="middle" font-size="18">⚠️</text>' : ''}
          <g transform="translate(0,34)">
            <rect x="${-w/2}" y="-13" width="${w}" height="23" rx="11" fill="${color}" stroke="#fff" stroke-width="1.5"/>
            <text x="0" y="3.5" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">${esc(name)}</text>
          </g>
        </g>`;
    }

    // ---------- boot ----------
    (async function boot() {
      if (DEMO) return bootDemo();
      if (!net.CLOUD_ENABLED) { app.innerHTML = errBox('Cloud not configured (js/net.js).'); return; }
      try { state = await net.readState(code); } catch (e) { console.error(e); }
      if (!state) { app.innerHTML = errBox('Room not found. <a href="index.html"><button>Back</button></a>'); return; }

      net.subscribeRoster(code, async () => {
        if (state && state.phase === 'lobby') { state.players = await rosterPlayers(); render(); }
      });
      net.subscribeActions(code, (row) => {
        if (row && state && state.phase === 'choose' && row.round === state.round) { lockedIds.add(row.player_id); render(); }
      });

      if (state.phase === 'lobby') { state.players = await rosterPlayers(); render(); }
      else { startTicking(); render(); }
    })();

    // Visual demo (no DB): host.html?demo=1
    function bootDemo() {
      const names = ['Red Rogue', 'Blue Barracuda', 'Green Galleon', 'Golden Gull', 'Purple Parrot'];
      const treasure = [12, 9, 7, 10, 8];
      state = E.lobbyState('DEMO');
      E.startGame(state, names.map((n, i) => ({ player_id: 'p' + i, name: n, color_index: i })));
      state.round = 4;
      state.phase = (DEMO === 'reveal') ? 'reveal' : 'choose';
      state.deadline = Date.now() + 15000;
      state.players.forEach((p, i) => { p.treasure = treasure[i]; });
      state.players[3].damaged = true;
      lockedIds = new Set(['p0', 'p2']);
      if (state.phase === 'reveal') {
        state.messages = [
          { emoji: '⛵', text: 'Green Galleon sailed to Gold Cove.', color: '#2a9d3a' },
          { emoji: '💰', text: 'Red Rogue found treasure on Skull Rock!', color: '#e63946' },
          { emoji: '💣', text: "Someone sabotaged Golden Gull's ship!", anon: true },
          { emoji: '💥', text: 'Someone fired a cannon at Blue Barracuda! Blue Barracuda dropped 1 treasure on Cannon Cay.', anon: true },
        ];
      }
      render();
    }

    async function rosterPlayers() {
      const roster = await net.readRoster(code);
      return roster.map(r => {
        const c = E.COLORS[r.color_index] || E.COLORS[0];
        return { id: r.player_id, name: r.name, color: c.hex, colorName: c.name,
                 island: null, treasure: 0, damaged: false, locked: false };
      });
    }

    function errBox(msg) { return `<div class="center"><h1 class="title">⚓</h1><div class="banner">${msg}</div></div>`; }

    // ---------- referee loop ----------
    function startTicking() { clearInterval(tick); tick = setInterval(onTick, 250); }
    async function onTick() {
      if (!state) return;
      const el = document.getElementById('timer');
      if (el) { el.textContent = secsLeft(); el.classList.toggle('urgent', secsLeft() <= 5); }
      if (DEMO) return;
      if (Date.now() >= state.deadline && !resolving) {
        resolving = true;
        try {
          if (state.phase === 'choose') await doResolve();
          else if (state.phase === 'reveal') await advance();
        } catch (e) { console.error(e); }
        resolving = false;
      }
    }

    async function doResolve() {
      const submitted = await net.readActions(code, state.round);
      const actions = {};
      for (const p of state.players) {
        const a = submitted[p.id];
        actions[p.id] = (a && E.isLegal(state, p, a)) ? a : E.defaultAction(state, p);
      }
      E.resolveRound(state, actions);
      state.phase = 'reveal';
      state.deadline = Date.now() + E.REVEAL_SECONDS * 1000;
      await net.writeState(code, state);
      render();
    }

    async function advance() {
      if (state.round >= state.totalRounds) {
        E.endGame(state); await net.writeState(code, state); clearInterval(tick); render(); return;
      }
      state.round += 1;
      state.phase = 'choose';
      state.messages = [];
      state.deadline = Date.now() + E.CHOOSE_SECONDS * 1000;
      lockedIds = new Set();
      await net.writeState(code, state);
      render();
    }

    async function startGame() {
      const roster = await net.readRoster(code);
      if (roster.length < 3) { alert('Need at least 3 pirates'); return; }
      E.startGame(state, roster);
      state.deadline = Date.now() + E.CHOOSE_SECONDS * 1000;
      lockedIds = new Set();
      await net.writeState(code, state);
      startTicking();
      render();
    }

    // ---------- render ----------
    function render() {
      if (!state) return;
      if (state.phase === 'lobby') return renderLobby();
      if (state.phase === 'over') return renderEnd();
      renderGame();
    }

    async function renderLobby() {
      const players = state.players || [];
      const chips = players.map(p =>
        `<div class="chip"><span class="swatch" style="background:${p.color}"></span>${esc(p.name)}</div>`
      ).join('') || '<div class="muted">Waiting for pirates to join…</div>';

      app.innerHTML = `
        <div class="center">
          <h1 class="title">🏴‍☠️ Treasure Traitors</h1>
          <div class="ribbon">Pirate Party</div>
          <div class="tagline" style="margin-top:10px">Sail. Steal. Betray your friends.</div>
          <div class="lobby-grid">
            <div class="card">
              <div class="muted">Scan to join on your phone</div>
              <div class="qr" id="qr" style="margin:10px 0"></div>
              <div class="muted">or go to the room code:</div>
              <div class="roomcode">${esc(state.code)}</div>
            </div>
            <div class="card">
              <h2>Crew (${players.length}/6)</h2>
              <div class="player-chips">${chips}</div>
              <p class="hint">Need 3–6 pirates to set sail.</p>
              <button id="startBtn" ${players.length < 3 ? 'disabled' : ''}>⚓ Start the Voyage!</button>
            </div>
          </div>
        </div>`;

      const btn = document.getElementById('startBtn');
      if (btn) btn.onclick = startGame;
      try {
        const dataUrl = await QRCode.toDataURL(net.joinUrl(code), { width: 280, margin: 1 });
        const qr = document.getElementById('qr');
        if (qr) qr.innerHTML = `<img src="${dataUrl}" alt="Join QR" />`;
      } catch (e) { console.warn('QR failed', e); }
    }

    function renderGame() {
      const isReveal = state.phase === 'reveal';
      const islands = state.map.islands;

      // White route lines between neighbors (rendered under everything).
      let edges = '';
      const seen = new Set();
      for (const [name, isl] of Object.entries(islands)) {
        for (const nb of isl.neighbors) {
          const key = [name, nb].sort().join('|');
          if (seen.has(key)) continue;
          seen.add(key);
          const a = islands[name], b = islands[nb];
          edges += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#0b3a55" stroke-width="11" stroke-linecap="round" opacity="0.35"/>`
                 + `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.9" stroke-dasharray="1 16"/>`;
        }
      }

      // Island nodes: sandy disc, emoji, gold treasure pill, blue name pill.
      let nodes = '';
      for (const [name, isl] of Object.entries(islands)) {
        const emoji = ISLAND_EMOJI[name] || '🏝️';
        const w = Math.max(96, name.length * 11 + 26);
        const tnum = isl.treasure;
        const treasurePill = tnum > 0
          ? `<g transform="translate(${isl.x},${isl.y + 20})">
               <rect x="-30" y="-13" width="60" height="24" rx="12" fill="#f4c44a" stroke="#a9712f" stroke-width="2"/>
               <text x="0" y="4" text-anchor="middle" font-size="14" font-weight="900" fill="#5b3415">💰 ${tnum}</text></g>`
          : '';
        nodes += `
          <ellipse cx="${isl.x}" cy="${isl.y + 8}" rx="58" ry="20" fill="#000" opacity="0.18"/>
          <ellipse cx="${isl.x}" cy="${isl.y}" rx="56" ry="38" fill="url(#sand)" stroke="#c9a063" stroke-width="3"/>
          <text x="${isl.x}" y="${isl.y - 6}" text-anchor="middle" font-size="46">${emoji}</text>
          ${treasurePill}
          <g transform="translate(${isl.x},${isl.y + 56})">
            <rect x="${-w/2}" y="-15" width="${w}" height="28" rx="14" fill="#1f6fa8" stroke="#ffffff" stroke-width="2"/>
            <text x="0" y="4.5" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">${esc(name)}</text>
          </g>`;
      }

      // Ships fanned around their island.
      let ships = '';
      for (const [name, isl] of Object.entries(islands)) {
        const here = state.players.filter(p => p.island === name);
        here.forEach((p, i) => {
          const ang = (i / Math.max(1, here.length)) * Math.PI * 2 - Math.PI / 2;
          ships += shipOnMap(isl.x + Math.cos(ang) * 92, isl.y + Math.sin(ang) * 76, p.color, p.name, p.damaged);
        });
      }

      // Top-right scoreboard tiles.
      const tiles = state.players.slice().sort((a, b) => b.treasure - a.treasure).map(p => `
        <div class="ship-tile ${p.damaged ? 'dmg' : ''}">
          ${(!isReveal && lockedIds.has(p.id)) ? '<span class="ready">✔️</span>' : ''}
          ${shipMiniSVG(p.color)}
          <span class="count">${p.treasure}</span>
          <span class="chest">🧰</span>
        </div>`).join('');

      const overlay = isReveal ? `
        <div class="reveal-overlay wood">
          <h3>📜 Ship's Log</h3>
          ${state.messages.map((m, i) => `<div class="log-item" style="animation-delay:${i*0.15}s">${m.emoji} ${esc(m.text)}</div>`).join('')}
        </div>` : '';

      app.innerHTML = `
        <div class="board">
          <svg class="map-svg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet">
            <defs>
              <radialGradient id="sand" cx="50%" cy="38%" r="70%">
                <stop offset="0%" stop-color="#f9ecc4"/>
                <stop offset="70%" stop-color="#eccf8e"/>
                <stop offset="100%" stop-color="#d9b877"/>
              </radialGradient>
            </defs>
            ${edges}${nodes}${ships}
          </svg>

          <div class="topbar">
            <div class="logo-badge">
              <div class="logo-main">TREASURE TRAITORS</div>
              <div class="ribbon">Pirate Party</div>
            </div>
            <div class="center-hud">
              <div class="wood round-pill">Round <b>${state.round}</b> / ${state.totalRounds}</div>
              <div class="wood timer-medallion" id="timer">${secsLeft()}</div>
            </div>
            <div class="wood scoreboard-bar">${tiles}</div>
          </div>

          <div class="phase-label">${isReveal ? '🎬 Reveal!' : '🤫 Choose yer move!'}</div>
          ${overlay}
        </div>`;
    }

    function renderEnd() {
      const r = state.results;
      const standings = r.standings.map((p, i) => `
        <div class="score-row">
          <span style="width:28px;font-weight:900">${i===0?'👑':(i+1)}</span>
          <span class="swatch" style="background:${p.color}"></span>
          <span class="score-name">${esc(p.name)}</span>
          <span class="score-treasure">💰 ${p.treasure}</span>
        </div>`).join('');
      const awards = r.awards.map(a => `
        <div class="award">
          <div style="font-size:32px">${a.emoji}</div>
          <div class="atitle">${esc(a.title)}</div>
          <div class="aplayer" style="color:${a.color}">${esc(a.player)}</div>
          <div class="muted">${esc(a.detail)}</div>
        </div>`).join('');

      app.innerHTML = `
        <div class="center">
          <div style="font-size:64px">🏴‍☠️🏆</div>
          <div class="muted">The richest pirate wins!</div>
          <div class="winner" style="color:${r.winner.color}">${esc(r.winner.name)} wins with 💰 ${r.winner.treasure}!</div>
          <div class="card" style="min-width:340px;max-width:520px;width:100%"><h3>Final treasure count</h3>${standings}</div>
          <div class="awards">${awards}</div>
          <a href="index.html"><button>⚓ New Game</button></a>
        </div>`;
    }
  </script>
</body>
</html>
