<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Treasure Traitors — Main Screen</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Reveal-phase motion (SVG groups) */
    @keyframes ship-hit {
      0%,100% { transform: translate(0,0) rotate(0); }
      20% { transform: translate(-5px,-2px) rotate(-7deg); }
      40% { transform: translate(5px,1px) rotate(6deg); }
      60% { transform: translate(-4px,0) rotate(-4deg); }
      80% { transform: translate(3px,0) rotate(3deg); }
    }
    .ship-hit { animation: ship-hit .45s ease 2; animation-delay: .8s; transform-box: fill-box; transform-origin: center; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    .bob { animation: bob 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  </style>
  <script type="importmap">
  { "imports": { "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2" } }
  </script>
</head>
<body class="sea-deco">
  <div id="app"></div>

  <script type="module">
    import QRCode from 'https://esm.sh/qrcode@1.5.3';
    import * as net from './js/net.js';
    import * as E from './js/engine.js';
    import { SPRITES_ENABLED, ISLAND_SPRITES, SHIP_SPRITES } from './assets/sprites.js';

    const code = net.roomFromUrl();
    const app = document.getElementById('app');
    const DEMO = new URL(location.href).searchParams.get('demo');

    let state = null;
    let lockedIds = new Set();
    let tick = null;
    let resolving = false;
    let renderSeq = 0;          // bumps each render so SMIL animations restart

    // ---- keep the main screen awake for the whole match (on by default) ----
    // Uses the native Screen Wake Lock API; re-acquires when the tab regains
    // focus (the OS drops the lock when hidden). Falls back to NoSleep.js on
    // older browsers without the API (e.g. iOS Safari < 16.4).
    let wakeLock = null;
    async function requestWakeLock() {
      if (wakeLock || !('wakeLock' in navigator)) return;
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      } catch (e) { /* may need a gesture; retried on interaction/visibility */ }
    }
    (async function keepAwake() {
      requestWakeLock();
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') requestWakeLock();
      });
      window.addEventListener('pointerdown', requestWakeLock);
      window.addEventListener('keydown', requestWakeLock);
      if (!('wakeLock' in navigator)) {
        try {
          const mod = await import('https://esm.sh/nosleep.js@0.12.0');
          const ns = new (mod.default || mod)();
          const enable = () => ns.enable().catch(() => {});
          window.addEventListener('pointerdown', enable, { once: true });
          window.addEventListener('keydown', enable, { once: true });
        } catch (e) { /* fallback unavailable — ignore */ }
      }
    })();

    const ISLAND_EMOJI = {
      'Skull Rock': '💀', 'Rum Bay': '🍾', 'Gold Cove': '🏛️', 'Cannon Cay': '💣',
      'Shark Reef': '🦈', 'Monkey Isle': '🐒', 'Shipwreck Point': '⚓', 'Treasure Atoll': '🗿',
    };

    function esc(s) { return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
    function secsLeft() { return state ? Math.max(0, Math.ceil((state.deadline - Date.now()) / 1000)) : 0; }

    // ---- ship art (tinted by player color) ----
    function shipPaths(color) {
      return `
        <path d="M-22 6 L22 6 L16 20 L-16 20 Z" fill="#7a4a22" stroke="#5b3415" stroke-width="1.5"/>
        <rect x="-22" y="1.5" width="44" height="6" rx="3" fill="#9a6a3a"/>
        <rect x="-1.2" y="-26" width="2.6" height="32" fill="#5b3b1a"/>
        <path d="M2 -24 L2 2 L22 -2 Q15 -12 2 -24 Z" fill="${color}"/>
        <path d="M-2 -22 L-2 1 L-18 -2 Q-11 -11 -2 -22 Z" fill="${color}" opacity="0.82"/>
        <path d="M2 -27 L13 -25 L2 -22 Z" fill="#15171a"/>`;
    }
    // Ship body: sprite image if provided, else the built-in vector ship.
    function shipArt(colorIndex, color) {
      const sp = SPRITES_ENABLED && SHIP_SPRITES[colorIndex];
      if (sp) return `<image href="${sp}" x="-27" y="-33" width="54" height="60" preserveAspectRatio="xMidYMid meet"/>`;
      return shipPaths(color);
    }
    function shipMiniSVG(colorIndex, color, w = 38) {
      return `<svg width="${w}" viewBox="-28 -34 56 62" aria-hidden="true">${shipArt(colorIndex, color)}</svg>`;
    }
    // Island body: sprite image if provided, else built-in disc + palms + emoji.
    function islandArt(isl, name) {
      const sp = SPRITES_ENABLED && ISLAND_SPRITES[isl.art];
      if (sp) return `<image href="${sp}" x="${isl.x - 90}" y="${isl.y - 96}" width="180" height="162" preserveAspectRatio="xMidYMid meet"/>`;
      const emoji = ISLAND_EMOJI[name] || '🏝️';
      return `
        <ellipse cx="${isl.x}" cy="${isl.y + 12}" rx="64" ry="18" fill="#000" opacity="0.18"/>
        <ellipse cx="${isl.x}" cy="${isl.y + 6}" rx="60" ry="34" fill="#b89b6a"/>
        <ellipse cx="${isl.x}" cy="${isl.y}" rx="56" ry="32" fill="url(#sand)" stroke="#c9a063" stroke-width="3"/>
        <text x="${isl.x - 34}" y="${isl.y - 6}" text-anchor="middle" font-size="30">🌴</text>
        <text x="${isl.x + 33}" y="${isl.y - 11}" text-anchor="middle" font-size="25">🌴</text>
        <text x="${isl.x}" y="${isl.y - 1}" text-anchor="middle" font-size="44">${emoji}</text>`;
    }
    function shipGroup(p, pos, opts = {}) {
      const w = Math.max(58, p.name.length * 9 + 20);
      const inner = `
        <g transform="scale(0.82)">
          ${shipArt(p.colorIndex, p.color)}
          ${p.damaged ? '<text x="0" y="-3" text-anchor="middle" font-size="18">⚠️</text>' : ''}
          <g transform="translate(0,34)">
            <rect x="${-w/2}" y="-13" width="${w}" height="23" rx="11" fill="${p.color}" stroke="#fff" stroke-width="1.5"/>
            <text x="0" y="3.5" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">${esc(p.name)}</text>
          </g>
        </g>`;
      const mid = `<g class="${opts.hit ? 'ship-hit' : 'bob'}">${inner}</g>`;
      const anim = opts.fromPos
        ? `<animateTransform attributeName="transform" type="translate" from="${opts.fromPos.x} ${opts.fromPos.y}" to="${pos.x} ${pos.y}" dur="2.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1"/>`
        : '';
      const wake = opts.fromPos ? '<ellipse cx="0" cy="14" rx="20" ry="5" fill="#fff" opacity="0.5"/>' : '';
      return `<g transform="translate(${pos.x},${pos.y})">${anim}${wake}${mid}</g>`;
    }

    // ---- FX helpers (SMIL) ----
    function coinFX(sx, sy, tx, ty, begin = 0) {
      return `<g opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" begin="${begin}s" dur="1.2s" fill="freeze"/>
        <g transform="translate(${sx},${sy})">
          <animateTransform attributeName="transform" type="translate" from="${sx} ${sy}" to="${tx} ${ty}" begin="${begin}s" dur="1.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.3 0 0.2 1"/>
          <circle r="11" fill="#f4c44a" stroke="#a9712f" stroke-width="2"/>
          <text x="0" y="4.5" text-anchor="middle" font-size="13" font-weight="900" fill="#5b3415">$</text>
        </g></g>`;
    }
    function ballFX(tx, ty) {
      const sx = tx + 120, sy = ty - 320;
      return `<g>
        <g transform="translate(${sx},${sy})">
          <animateTransform attributeName="transform" type="translate" from="${sx} ${sy}" to="${tx} ${ty}" dur="0.8s" fill="freeze"/>
          <circle r="8" fill="#222" stroke="#000" stroke-width="1"/>
        </g>
        <text x="${tx}" y="${ty + 10}" text-anchor="middle" font-size="38" opacity="0">💥
          <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3;1" begin="0.78s" dur="0.7s" fill="freeze"/>
        </text></g>`;
    }
    function sparkFX(x, y, emoji, begin = 0) {
      return `<text x="${x}" y="${y}" text-anchor="middle" font-size="28" opacity="0">${emoji}
        <animate attributeName="opacity" values="0;1;0" begin="${begin}s" dur="1s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -14" begin="${begin}s" dur="1s" fill="freeze"/>
      </text>`;
    }

    // ---------- boot ----------
    (async function boot() {
      if (DEMO) return bootDemo();
      if (!net.CLOUD_ENABLED) { app.innerHTML = errBox('Cloud not configured (js/net.js).'); return; }
      try { state = await net.readState(code); } catch (e) { console.error(e); }
      if (!state) { app.innerHTML = errBox('Room not found. <a href="index.html"><button>Back</button></a>'); return; }

      net.subscribeRoster(code, async () => {
        if (state && state.phase === 'lobby') { state.players = await rosterPlayers(); render(); }
      });
      net.subscribeActions(code, (row) => {
        if (row && state && state.phase === 'choose' && row.round === state.round) { lockedIds.add(row.player_id); render(); }
      });

      if (state.phase === 'lobby') { state.players = await rosterPlayers(); render(); }
      else { startTicking(); render(); }
    })();

    function bootDemo() {
      const names = ['Red Rogue', 'Blue Barracuda', 'Green Galleon', 'Golden Gull', 'Purple Parrot'];
      const treasure = [12, 9, 7, 10, 8];
      state = E.lobbyState('DEMO');
      E.startGame(state, names.map((n, i) => ({ player_id: 'p' + i, name: n, color_index: i })));
      state.round = 4;
      state.phase = (DEMO === 'reveal') ? 'reveal' : 'choose';
      state.deadline = Date.now() + 15000;
      state.players.forEach((p, i) => { p.treasure = treasure[i]; });
      const pl = state.players;
      pl[3].damaged = true;
      lockedIds = new Set(['p0', 'p2']);
      if (state.phase === 'reveal') {
        const from2 = pl[2].island;
        const to2 = state.map.islands[from2].neighbors[0];
        pl[2].island = to2;
        state.events = [
          { kind: 'sail', id: pl[2].id, from: from2, to: to2 },
          { kind: 'scavenge', id: pl[0].id, island: pl[0].island },
          { kind: 'cannon', target: pl[1].id, island: pl[1].island },
          { kind: 'sabotage', target: pl[3].id, island: pl[3].island },
        ];
        state.messages = [
          { emoji: '⛵', text: `${pl[2].name} sailed to ${to2}.` },
          { emoji: '💰', text: `${pl[0].name} found treasure on ${pl[0].island}!` },
          { emoji: '💥', text: `Someone fired a cannon at ${pl[1].name}!` },
          { emoji: '💣', text: `Someone sabotaged ${pl[3].name}'s ship!` },
        ];
      }
      render();
      if (DEMO !== 'reveal') startTickingDemo();
    }
    function startTickingDemo() { clearInterval(tick); tick = setInterval(() => { const el = document.getElementById('timer'); if (el) el.textContent = secsLeft(); }, 250); }

    async function rosterPlayers() {
      const roster = await net.readRoster(code);
      return roster.map(r => {
        const c = E.COLORS[r.color_index] || E.COLORS[0];
        return { id: r.player_id, name: r.name, color: c.hex, colorName: c.name,
                 island: null, treasure: 0, damaged: false, locked: false };
      });
    }
    function errBox(msg) { return `<div class="center"><h1 class="title">⚓</h1><div class="banner">${msg}</div></div>`; }

    // ---------- referee loop ----------
    function startTicking() { clearInterval(tick); tick = setInterval(onTick, 250); }
    async function onTick() {
      if (!state) return;
      const el = document.getElementById('timer');
      if (el) { el.textContent = secsLeft(); el.classList.toggle('urgent', secsLeft() <= 5); }
      if (Date.now() >= state.deadline && !resolving) {
        resolving = true;
        try {
          if (state.phase === 'choose') await doResolve();
          else if (state.phase === 'reveal') await advance();
        } catch (e) { console.error(e); }
        resolving = false;
      }
    }
    async function doResolve() {
      const submitted = await net.readActions(code, state.round);
      const actions = {};
      for (const p of state.players) {
        const a = submitted[p.id];
        actions[p.id] = (a && E.isLegal(state, p, a)) ? a : E.defaultAction(state, p);
      }
      E.resolveRound(state, actions);
      state.phase = 'reveal';
      state.deadline = Date.now() + E.REVEAL_SECONDS * 1000;
      await net.writeState(code, state);
      render();
    }
    async function advance() {
      if (state.round >= state.totalRounds) {
        E.endGame(state); await net.writeState(code, state); clearInterval(tick); render(); return;
      }
      state.round += 1;
      state.phase = 'choose';
      state.messages = [];
      state.events = [];
      state.deadline = Date.now() + E.CHOOSE_SECONDS * 1000;
      lockedIds = new Set();
      await net.writeState(code, state);
      render();
    }
    async function startGame() {
      const roster = await net.readRoster(code);
      if (roster.length < 3) { alert('Need at least 3 pirates'); return; }
      E.startGame(state, roster);
      state.deadline = Date.now() + E.CHOOSE_SECONDS * 1000;
      lockedIds = new Set();
      await net.writeState(code, state);
      startTicking();
      render();
    }

    // ---------- render ----------
    function render() {
      if (!state) return;
      if (state.phase === 'lobby') return renderLobby();
      if (state.phase === 'over') return renderEnd();
      renderGame();
    }

    async function renderLobby() {
      const players = state.players || [];
      const chips = players.map(p =>
        `<div class="chip"><span class="swatch" style="background:${p.color}"></span>${esc(p.name)}</div>`
      ).join('') || '<div class="muted">Waiting for pirates to join…</div>';
      app.innerHTML = `
        <div class="center">
          <h1 class="title">🏴‍☠️ Treasure Traitors</h1>
          <div class="ribbon">Pirate Party</div>
          <div class="tagline" style="margin-top:10px">Sail. Steal. Betray your friends.</div>
          <div class="lobby-grid">
            <div class="card">
              <div class="muted">Scan to join on your phone</div>
              <div class="qr" id="qr" style="margin:10px 0"></div>
              <div class="muted">or go to the room code:</div>
              <div class="roomcode">${esc(state.code)}</div>
            </div>
            <div class="card">
              <h2>Crew (${players.length}/6)</h2>
              <div class="player-chips">${chips}</div>
              <p class="hint">Need 3–6 pirates to set sail.</p>
              <button id="startBtn" ${players.length < 3 ? 'disabled' : ''}>⚓ Start the Voyage!</button>
            </div>
          </div>
        </div>`;
      const btn = document.getElementById('startBtn');
      if (btn) btn.onclick = startGame;
      try {
        const dataUrl = await QRCode.toDataURL(net.joinUrl(code), { width: 280, margin: 1 });
        const qr = document.getElementById('qr');
        if (qr) qr.innerHTML = `<img src="${dataUrl}" alt="Join QR" />`;
      } catch (e) { console.warn('QR failed', e); }
    }

    // Ship display positions (island center + fan offset).
    function shipPositions(islands) {
      const byIsland = {};
      for (const p of state.players) (byIsland[p.island] = byIsland[p.island] || []).push(p);
      const pos = {};
      for (const [name, arr] of Object.entries(byIsland)) {
        const c = islands[name]; if (!c) continue;
        arr.forEach((p, i) => {
          const ang = (i / Math.max(1, arr.length)) * Math.PI * 2 - Math.PI / 2;
          pos[p.id] = { x: c.x + Math.cos(ang) * 92, y: c.y + Math.sin(ang) * 76 };
        });
      }
      return pos;
    }

    // Wooden plank rope-bridge between two island centers.
    function bridge(a, b) {
      const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
      const ux = dx / len, uy = dy / len, px = -uy, py = ux;
      const inset = 60;
      const ax = a.x + ux * inset, ay = a.y + uy * inset;
      const bx = b.x - ux * inset, by = b.y - uy * inset;
      const ang = Math.atan2(dy, dx) * 180 / Math.PI;
      let s = `<line x1="${ax+px*7}" y1="${ay+py*7}" x2="${bx+px*7}" y2="${by+py*7}" stroke="#e9d3a0" stroke-width="3" opacity="0.85"/>`
            + `<line x1="${ax-px*7}" y1="${ay-py*7}" x2="${bx-px*7}" y2="${by-py*7}" stroke="#e9d3a0" stroke-width="3" opacity="0.85"/>`;
      const blen = Math.hypot(bx - ax, by - ay);
      const n = Math.max(3, Math.round(blen / 24));
      for (let i = 0; i <= n; i++) {
        const t = i / n, cx = ax + (bx - ax) * t, cy = ay + (by - ay) * t;
        s += `<rect x="-9" y="-3" width="18" height="6" rx="2" fill="#a9742f" stroke="#5b3415" stroke-width="0.8" transform="translate(${cx},${cy}) rotate(${ang})"/>`;
      }
      return s;
    }

    function renderGame() {
      const isReveal = state.phase === 'reveal';
      const islands = state.map.islands;
      renderSeq++;
      const pos = shipPositions(islands);
      const center = (name) => ({ x: islands[name].x, y: islands[name].y });
      const events = isReveal ? (state.events || []) : [];

      // Bridges
      let edges = '';
      const seen = new Set();
      for (const [name, isl] of Object.entries(islands)) {
        for (const nb of isl.neighbors) {
          const key = [name, nb].sort().join('|');
          if (seen.has(key)) continue;
          seen.add(key);
          edges += bridge(islands[name], islands[nb]);
        }
      }

      // Decorative gulls
      const gulls = [[120,150],[760,150],[470,470],[900,470]].map(([x,y]) =>
        `<path d="M${x} ${y} q9 -8 18 0 q9 -8 18 0" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>`).join('');

      // Islands (layered base + palms + feature + treasure + name)
      let nodes = '';
      for (const [name, isl] of Object.entries(islands)) {
        const w = Math.max(96, name.length * 11 + 26);
        const tnum = isl.treasure;
        const treasurePill = tnum > 0
          ? `<g transform="translate(${isl.x},${isl.y + 30})">
               <rect x="-30" y="-13" width="60" height="24" rx="12" fill="#f4c44a" stroke="#a9712f" stroke-width="2"/>
               <text x="0" y="4" text-anchor="middle" font-size="14" font-weight="900" fill="#5b3415">💰 ${tnum}</text></g>`
          : '';
        nodes += `
          ${islandArt(isl, name)}
          ${treasurePill}
          <g transform="translate(${isl.x},${isl.y + 60})">
            <rect x="${-w/2}" y="-15" width="${w}" height="28" rx="14" fill="#1f6fa8" stroke="#ffffff" stroke-width="2"/>
            <text x="0" y="4.5" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">${esc(name)}</text>
          </g>`;
      }

      // Ships
      const sailFrom = {}; for (const e of events) if (e.kind === 'sail') sailFrom[e.id] = center(e.from);
      const hitIds = new Set(); for (const e of events) if (e.kind === 'cannon') hitIds.add(e.target); else if (e.kind === 'sabotage') hitIds.add(e.target);
      let ships = '';
      for (const p of state.players) {
        if (!pos[p.id]) continue;
        ships += shipGroup(p, pos[p.id], { fromPos: sailFrom[p.id], hit: hitIds.has(p.id) });
      }

      // FX layer (reveal only)
      let fx = '';
      for (const e of events) {
        if (e.kind === 'cannon' && pos[e.target]) {
          const sp = pos[e.target], c = center(e.island);
          fx += ballFX(sp.x, sp.y) + coinFX(sp.x, sp.y, c.x, c.y, 0.85);
        } else if (e.kind === 'scavenge' && pos[e.id]) {
          const c = center(e.island), sp = pos[e.id];
          fx += sparkFX(c.x, c.y - 10, '✨', 0) + coinFX(c.x, c.y, sp.x, sp.y, 0.35);
        } else if (e.kind === 'loot' && pos[e.actor] && pos[e.target]) {
          fx += coinFX(pos[e.target].x, pos[e.target].y, pos[e.actor].x, pos[e.actor].y, 0.1);
        } else if (e.kind === 'sabotage' && pos[e.target]) {
          fx += sparkFX(pos[e.target].x, pos[e.target].y - 16, '💢', 0.2);
        } else if (e.kind === 'repair' && pos[e.id]) {
          fx += sparkFX(pos[e.id].x, pos[e.id].y - 18, '🔧', 0);
        }
      }

      const tiles = state.players.slice().sort((a, b) => b.treasure - a.treasure).map(p => `
        <div class="ship-tile ${p.damaged ? 'dmg' : ''}">
          ${(!isReveal && lockedIds.has(p.id)) ? '<span class="ready">✔️</span>' : ''}
          ${shipMiniSVG(p.colorIndex, p.color)}
          <span class="count">${p.treasure}</span>
          <span class="chest">🧰</span>
        </div>`).join('');

      const overlay = isReveal ? `
        <div class="reveal-overlay wood">
          <h3>📜 Ship's Log</h3>
          ${state.messages.map((m, i) => `<div class="log-item" style="animation-delay:${i*0.15}s">${m.emoji} ${esc(m.text)}</div>`).join('')}
        </div>` : '';

      app.innerHTML = `
        <div class="board">
          <svg class="map-svg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet" data-seq="${renderSeq}">
            <defs>
              <radialGradient id="sand" cx="50%" cy="38%" r="70%">
                <stop offset="0%" stop-color="#f9ecc4"/>
                <stop offset="70%" stop-color="#eccf8e"/>
                <stop offset="100%" stop-color="#d9b877"/>
              </radialGradient>
            </defs>
            ${gulls}${edges}${nodes}${ships}
            <g class="fx-layer">${fx}</g>
          </svg>

          <div class="topbar">
            <div class="logo-badge">
              <div class="logo-main">TREASURE TRAITORS</div>
              <div class="ribbon">Pirate Party</div>
            </div>
            <div class="center-hud">
              <div class="wood round-pill">Round <b>${state.round}</b> / ${state.totalRounds}</div>
              <div class="wood timer-medallion" id="timer">${secsLeft()}</div>
            </div>
            <div class="wood scoreboard-bar">${tiles}</div>
          </div>

          <div class="phase-label">${isReveal ? '🎬 Reveal!' : '🤫 Choose yer move!'}</div>
          ${overlay}
        </div>`;
    }

    function renderEnd() {
      const r = state.results;
      const standings = r.standings.map((p, i) => `
        <div class="score-row">
          <span style="width:28px;font-weight:900">${i===0?'👑':(i+1)}</span>
          <span class="swatch" style="background:${p.color}"></span>
          <span class="score-name">${esc(p.name)}</span>
          <span class="score-treasure">💰 ${p.treasure}</span>
        </div>`).join('');
      const awards = r.awards.map(a => `
        <div class="award">
          <div style="font-size:32px">${a.emoji}</div>
          <div class="atitle">${esc(a.title)}</div>
          <div class="aplayer" style="color:${a.color}">${esc(a.player)}</div>
          <div class="muted">${esc(a.detail)}</div>
        </div>`).join('');
      app.innerHTML = `
        <div class="center">
          <div style="font-size:64px">🏴‍☠️🏆</div>
          <div class="muted">The richest pirate wins!</div>
          <div class="winner" style="color:${r.winner.color}">${esc(r.winner.name)} wins with 💰 ${r.winner.treasure}!</div>
          <div class="card" style="min-width:340px;max-width:520px;width:100%"><h3>Final treasure count</h3>${standings}</div>
          <div class="awards">${awards}</div>
          <a href="index.html"><button>⚓ New Game</button></a>
        </div>`;
    }
  </script>
</body>
</html>
