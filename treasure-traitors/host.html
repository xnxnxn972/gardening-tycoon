<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Treasure Traitors — Main Screen</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
  { "imports": { "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2" } }
  </script>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import QRCode from 'https://esm.sh/qrcode@1.5.3';
    import * as net from './js/net.js';
    import * as E from './js/engine.js';

    const code = net.roomFromUrl();
    const app = document.getElementById('app');

    let state = null;          // authoritative game state (host is the referee)
    let lockedIds = new Set();  // players who submitted this round (for READY tags)
    let tick = null;
    let resolving = false;

    function esc(s) { return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
    function secsLeft() { return state ? Math.max(0, Math.ceil((state.deadline - Date.now()) / 1000)) : 0; }

    // ---------- boot ----------
    (async function boot() {
      if (!net.CLOUD_ENABLED) { app.innerHTML = errBox('Cloud not configured (js/net.js).'); return; }
      try {
        state = await net.readState(code);
      } catch (e) { console.error(e); }
      if (!state) { app.innerHTML = errBox('Room not found. <a href="index.html"><button>Back</button></a>'); return; }

      // Roster changes only matter in the lobby.
      net.subscribeRoster(code, async () => {
        if (state && state.phase === 'lobby') { state.players = await rosterPlayers(); render(); }
      });
      // Watch action submissions to show who's locked in.
      net.subscribeActions(code, (row) => {
        if (row && state && state.phase === 'choose' && row.round === state.round) {
          lockedIds.add(row.player_id); render();
        }
      });

      if (state.phase === 'lobby') {
        state.players = await rosterPlayers();
        render();
      } else {
        startTicking(); // resume an in-progress match after a refresh
        render();
      }
    })();

    async function rosterPlayers() {
      const roster = await net.readRoster(code);
      return roster.map(r => {
        const c = E.COLORS[r.color_index] || E.COLORS[0];
        return { id: r.player_id, name: r.name, color: c.hex, colorName: c.name,
                 island: null, treasure: 0, damaged: false, locked: false };
      });
    }

    function errBox(msg) { return `<div class="center"><h1 class="title">⚓</h1><div class="banner">${msg}</div></div>`; }

    // ---------- referee loop ----------
    function startTicking() {
      clearInterval(tick);
      tick = setInterval(onTick, 250);
    }
    async function onTick() {
      if (!state) return;
      const el = document.getElementById('timer');
      if (el) el.textContent = secsLeft();
      if (Date.now() >= state.deadline && !resolving) {
        resolving = true;
        try {
          if (state.phase === 'choose') await doResolve();
          else if (state.phase === 'reveal') await advance();
        } catch (e) { console.error(e); }
        resolving = false;
      }
    }

    async function doResolve() {
      const submitted = await net.readActions(code, state.round);
      const actions = {};
      for (const p of state.players) {
        const a = submitted[p.id];
        actions[p.id] = (a && E.isLegal(state, p, a)) ? a : E.defaultAction(state, p);
      }
      E.resolveRound(state, actions);
      state.phase = 'reveal';
      state.deadline = Date.now() + E.REVEAL_SECONDS * 1000;
      await net.writeState(code, state);
      render();
    }

    async function advance() {
      if (state.round >= state.totalRounds) {
        E.endGame(state);
        await net.writeState(code, state);
        clearInterval(tick);
        render();
        return;
      }
      state.round += 1;
      state.phase = 'choose';
      state.messages = [];
      state.deadline = Date.now() + E.CHOOSE_SECONDS * 1000;
      lockedIds = new Set();
      await net.writeState(code, state);
      render();
    }

    async function startGame() {
      const roster = await net.readRoster(code);
      if (roster.length < 3) { alert('Need at least 3 pirates'); return; }
      E.startGame(state, roster);
      state.deadline = Date.now() + E.CHOOSE_SECONDS * 1000;
      lockedIds = new Set();
      await net.writeState(code, state);
      startTicking();
      render();
    }

    // ---------- render ----------
    function render() {
      if (!state) return;
      if (state.phase === 'lobby') return renderLobby();
      if (state.phase === 'over') return renderEnd();
      renderGame();
    }

    async function renderLobby() {
      const players = state.players || [];
      const chips = players.map(p =>
        `<div class="chip"><span class="swatch" style="background:${p.color}"></span>${esc(p.name)}</div>`
      ).join('') || '<div class="muted">Waiting for pirates to join…</div>';

      app.innerHTML = `
        <div class="center">
          <h1 class="title">🏴‍☠️ Treasure Traitors</h1>
          <div class="tagline">Sail. Steal. Betray your friends.</div>
          <div class="lobby-grid">
            <div class="card">
              <div class="muted">Scan to join on your phone</div>
              <div class="qr" id="qr" style="margin:10px 0"></div>
              <div class="muted">or go to the room code:</div>
              <div class="roomcode">${esc(state.code)}</div>
            </div>
            <div class="card">
              <h2>Crew (${players.length}/6)</h2>
              <div class="player-chips">${chips}</div>
              <p class="hint">Need 3–6 pirates to set sail.</p>
              <button id="startBtn" ${players.length < 3 ? 'disabled' : ''}>⚓ Start the Voyage!</button>
            </div>
          </div>
        </div>`;

      const btn = document.getElementById('startBtn');
      if (btn) btn.onclick = startGame;

      try {
        const url = net.joinUrl(code);
        const dataUrl = await QRCode.toDataURL(url, { width: 280, margin: 1 });
        const qr = document.getElementById('qr');
        if (qr) qr.innerHTML = `<img src="${dataUrl}" alt="Join QR" />`;
      } catch (e) { console.warn('QR failed', e); }
    }

    function renderGame() {
      const isReveal = state.phase === 'reveal';
      const islands = state.map.islands;

      let edges = '';
      const seen = new Set();
      for (const [name, isl] of Object.entries(islands)) {
        for (const nb of isl.neighbors) {
          const key = [name, nb].sort().join('|');
          if (seen.has(key)) continue;
          seen.add(key);
          const a = islands[name], b = islands[nb];
          edges += `<line class="edge" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" />`;
        }
      }

      let nodes = '';
      for (const [name, isl] of Object.entries(islands)) {
        const here = state.players.filter(p => p.island === name);
        const ships = here.map((p, i) => {
          const ang = (i / Math.max(1, here.length)) * Math.PI * 2 - Math.PI / 2;
          const sx = isl.x + Math.cos(ang) * 52, sy = isl.y + Math.sin(ang) * 52;
          const dmg = p.damaged ? '<tspan font-size="16">⚠️</tspan>' : '';
          return `<text class="ship-emoji" x="${sx}" y="${sy}" fill="${p.color}">🚢${dmg}</text>`
               + `<text x="${sx}" y="${sy + 22}" text-anchor="middle" font-size="13" font-weight="800" fill="${p.color}" stroke="#04222f" stroke-width="3" paint-order="stroke">${esc(p.name)}</text>`;
        }).join('');
        const treasure = isl.treasure > 0
          ? `<text class="island-treasure" x="${isl.x}" y="${isl.y + 7}">${'💰'.repeat(Math.min(isl.treasure,4))}<tspan font-size="14" dy="-2"> ${isl.treasure}</tspan></text>`
          : `<text class="island-treasure" x="${isl.x}" y="${isl.y + 7}" font-size="13" fill="#7a6">empty</text>`;
        nodes += `
          <circle class="island-node" cx="${isl.x}" cy="${isl.y}" r="34" />
          ${treasure}
          <text class="island-label" x="${isl.x}" y="${isl.y - 44}">${esc(name)}</text>
          ${ships}`;
      }

      const scoreboard = state.players.slice().sort((a,b)=>b.treasure-a.treasure).map(p => `
        <div class="score-row">
          <span class="swatch" style="background:${p.color}"></span>
          <span class="score-name">${esc(p.name)}</span>
          ${p.damaged ? '<span class="tag-damaged">DAMAGED</span>' : ''}
          ${(!isReveal && lockedIds.has(p.id)) ? '<span class="tag-locked">READY</span>' : ''}
          <span class="score-treasure">💰 ${p.treasure}</span>
        </div>`).join('');

      const log = isReveal
        ? state.messages.map((m,i) =>
            `<div class="log-item" style="animation-delay:${i*0.18}s">${m.emoji} ${esc(m.text)}</div>`).join('')
        : '<div class="muted" style="padding:10px">All captains are plotting… 🤫</div>';

      app.innerHTML = `
        <div class="host-wrap">
          <div class="host-header">
            <div class="roundbox">
              <div class="muted">ROUND</div>
              <div class="phasebadge">${state.round} / ${state.totalRounds}</div>
            </div>
            <div class="phasebadge" style="color:${isReveal ? '#ffd54a' : '#bfe6ff'}">
              ${isReveal ? '🎬 Reveal!' : '🤫 Choose yer move!'}
            </div>
            <div id="timer" class="bigtimer">${secsLeft()}</div>
          </div>
          <div class="map-panel">
            <svg class="map-svg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet">${edges}${nodes}</svg>
          </div>
          <div class="side-panel">
            <div class="card scoreboard"><h3>🏆 Booty</h3>${scoreboard}</div>
            <div class="card log-panel"><h3>📜 Ship's Log</h3>${log}</div>
          </div>
        </div>`;
    }

    function renderEnd() {
      const r = state.results;
      const standings = r.standings.map((p,i) => `
        <div class="score-row">
          <span style="width:28px;font-weight:900">${i===0?'👑':(i+1)}</span>
          <span class="swatch" style="background:${p.color}"></span>
          <span class="score-name">${esc(p.name)}</span>
          <span class="score-treasure">💰 ${p.treasure}</span>
        </div>`).join('');
      const awards = r.awards.map(a => `
        <div class="award">
          <div style="font-size:32px">${a.emoji}</div>
          <div class="atitle">${esc(a.title)}</div>
          <div class="aplayer" style="color:${a.color}">${esc(a.player)}</div>
          <div class="muted">${esc(a.detail)}</div>
        </div>`).join('');

      app.innerHTML = `
        <div class="center">
          <div style="font-size:64px">🏴‍☠️🏆</div>
          <div class="muted">The richest pirate wins!</div>
          <div class="winner" style="color:${r.winner.color}">${esc(r.winner.name)} wins with 💰 ${r.winner.treasure}!</div>
          <div class="card" style="min-width:340px;max-width:520px;width:100%"><h3>Final treasure count</h3>${standings}</div>
          <div class="awards">${awards}</div>
          <a href="index.html"><button>⚓ New Game</button></a>
        </div>`;
    }
  </script>
</body>
</html>
