<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>AT-ST Assault</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230c1018'/><path d='M9 5 H23 L25 7 V13 L23 15 H9 L7 13 V7 Z' fill='%23cdd3db'/><rect x='13' y='15' width='6' height='2' fill='%23cdd3db'/><rect x='14.5' y='16.5' width='3' height='2.2' fill='%23cdd3db'/><rect x='24' y='9.4' width='4.6' height='1.6' rx='0.6' fill='%239a9ea6'/><rect x='10.5' y='8' width='4' height='3' rx='0.6' fill='%230c1018'/><rect x='17.5' y='8' width='4' height='3' rx='0.6' fill='%230c1018'/><circle cx='16' cy='12.3' r='0.95' fill='%23e2473a'/><path d='M13 17 L10.5 22 L8 28' fill='none' stroke='%23cdd3db' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M19 17 L21.5 22 L24 28' fill='none' stroke='%23cdd3db' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/><rect x='5.4' y='27.4' width='6' height='2.6' rx='1' fill='%23cdd3db'/><rect x='20.6' y='27.4' width='6' height='2.6' rx='1' fill='%23cdd3db'/></svg>" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #0a0e14;
    font-family: 'Courier New', ui-monospace, monospace; color: #e8eef5; user-select: none; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .hud { position: absolute; inset: 0; pointer-events: none; }
  .score { position: absolute; top: 14px; right: 18px; text-align: right;
    font-weight: bold; font-size: 20px; letter-spacing: 1px; text-shadow: 0 1px 3px #000; }
  .score .hi { font-size: 12px; opacity: .8; font-weight: normal; }

  .back { position: absolute; top: 12px; left: 12px; pointer-events: auto;
    background: rgba(20,28,40,.7); color: #cfe0f5; border: 1px solid rgba(150,180,220,.4);
    padding: 7px 12px; border-radius: 8px; font-family: inherit; font-size: 12px;
    cursor: pointer; backdrop-filter: blur(4px); }
  .back:hover { background: rgba(40,55,80,.85); }

  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; gap: 10px;
    background: radial-gradient(circle at 50% 40%, rgba(10,16,26,.35), rgba(6,10,18,.82));
    pointer-events: auto; }
  .overlay.hidden { display: none; }
  .overlay h1 { font-size: clamp(26px, 6vw, 44px); letter-spacing: 5px; font-weight: bold;
    color: #fff; text-shadow: 0 2px 12px rgba(80,150,255,.5); }
  .overlay h2 { font-size: clamp(20px, 5vw, 34px); letter-spacing: 4px; color: #ff6b6b; }
  .overlay p { font-size: 13px; opacity: .85; line-height: 1.7; max-width: 460px; }
  .overlay .big { font-size: 18px; color: #9fd0ff; }
  .overlay .blink { animation: bl 1.1s steps(2) infinite; }
  @keyframes bl { 50% { opacity: .25; } }
  kbd { background: #1c2738; border: 1px solid #38506e; border-bottom-width: 2px;
    border-radius: 4px; padding: 1px 6px; font-family: inherit; font-size: 12px; color: #cfe0f5; }

  /* touch controls */
  .touch { position: absolute; bottom: 0; left: 0; right: 0; height: 38%;
    display: none; pointer-events: none; }
  .touch.show { display: block; }
  .tbtn { position: absolute; bottom: 22px; width: 74px; height: 74px; border-radius: 50%;
    background: rgba(30,42,60,.55); border: 1px solid rgba(150,180,220,.45); color: #dfeaf8;
    font-size: 26px; display: flex; align-items: center; justify-content: center;
    pointer-events: auto; backdrop-filter: blur(3px); }
  .tbtn:active { background: rgba(60,90,130,.8); }
  #tleft { left: 18px; } #tright { left: 104px; }
  #tfire { right: 22px; width: 92px; height: 92px; bottom: 16px; font-size: 14px;
    letter-spacing: 1px; background: rgba(120,40,40,.55); border-color: rgba(255,140,140,.5); color: #ffd9d9; }
  #tfire:active { background: rgba(180,50,50,.85); }
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <button class="back" onclick="location.href='index.html'">&#9664; Classic</button>
    <div class="score"><span id="score">0</span><br><span class="hi">HI <span id="hi">0</span></span></div>
  </div>

  <div class="touch" id="touch">
    <div class="tbtn" id="tleft">&#9664;</div>
    <div class="tbtn" id="tright">&#9654;</div>
    <div class="tbtn" id="tfire">FIRE</div>
  </div>

  <div class="overlay" id="ovStart">
    <h1>A T - S T &nbsp; A S S A U L T</h1>
    <p class="big">Drive the walker. Survive the assault on Hoth.</p>
    <p>
      <kbd>&larr;</kbd> <kbd>&rarr;</kbd> switch lanes &nbsp;&middot;&nbsp; <kbd>SPACE</kbd> fire laser<br>
      <b style="color:#ff8a8a">Shoot</b> the X-wings &nbsp;&middot;&nbsp;
      <b style="color:#8ab4ff">Dodge</b> the Jedi &amp; Yoda (they deflect blasts)
    </p>
    <p class="big blink">press SPACE / tap to begin</p>
  </div>

  <div class="overlay hidden" id="ovOver">
    <h2>G A M E &nbsp; O V E R</h2>
    <p class="big">distance <span id="finalScore">0</span></p>
    <p class="blink">press SPACE / tap to retry</p>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// ============================================================
// Constants
// ============================================================
const LANE_X = [-2.6, 0, 2.6];
const PLAYER_Z = 4;
const SPAWN_Z = -115;
const DESPAWN_Z = 12;
const GROUND_LEN = 260;
const SKY = 0xd6e3ef;

const START_SPEED = 26;     // world units / sec toward camera
const MAX_SPEED = 60;
const SPEED_RAMP = 0.8;     // per sec

// ============================================================
// Renderer / scene / camera
// ============================================================
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
const baseDPR = Math.min(window.devicePixelRatio || 1, 1);
let resScale = 1;                       // auto-lowered on slow devices
renderer.setPixelRatio(baseDPR * resScale);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = false;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 20, 100);

const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 400);
camera.position.set(0, 4.6, 9.2);
camera.lookAt(0, 1.4, -10);

// lights
scene.add(new THREE.HemisphereLight(0xffffff, 0x6a7a90, 0.95));
const sun = new THREE.DirectionalLight(0xffffff, 1.15);
sun.position.set(-8, 16, 6);
scene.add(sun);

// ============================================================
// Terrain
// ============================================================
const snowMat = new THREE.MeshLambertMaterial({ color: 0xf4f9fd });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(15, GROUND_LEN), snowMat);
ground.rotation.x = -Math.PI / 2;
ground.position.set(0, 0, -GROUND_LEN / 2 + DESPAWN_Z);
scene.add(ground);

// Scrolling environment — lane-edge dashes, canyon walls, and snow rocks all
// recycle together so the whole world slides toward the camera uniformly.
const scrollers = [];
const dashMat = new THREE.MeshBasicMaterial({ color: 0xcfe7ff });
const tuftMat = new THREE.MeshLambertMaterial({ color: 0xf4f9ff });
function addScroller(mesh, x, y, z) { mesh.position.set(x, y, z); scene.add(mesh); scrollers.push(mesh); }
const rand = (n) => { const r = Math.sin(n * 12.9898) * 43758.5453; return r - Math.floor(r); };

// lane-edge dashes (shared geometry, spaced out to keep the draw-call count low)
const dashGeo = new THREE.BoxGeometry(0.2, 0.05, 2.6);
for (let i = 0; i < 30; i++) {
  for (const bx of [-1.3, 1.3]) {
    addScroller(new THREE.Mesh(dashGeo, dashMat), bx, 0.03, -i * 8.5);
  }
}

// Canyon walls — one continuous low-poly ridge mesh per side (a single draw
// call each). The silhouette is periodic with period RIDGE_P, so the mesh can
// scroll forever and wrap seamlessly. Vertex colors + flat shading give the
// faceted, snow-capped ice look; fog swallows the far end.
const RIDGE_P = 64;                    // tile period (world units)
const RIDGE_ROWS = 20;                 // cross-section rows per period
function buildRidgeGeo(side) {
  const DZ = RIDGE_P / RIDGE_ROWS;
  const Z0 = 18, Z1 = -250;
  const N = Math.ceil((Z0 - Z1) / DZ);
  const pos = [], col = [], idx = [];
  const C = (r, g, b, m) => col.push(Math.min(1, r * m), Math.min(1, g * m), Math.min(1, b * m));
  for (let i = 0; i <= N; i++) {
    const z = Z0 - i * DZ;
    const k = i % RIDGE_ROWS;          // periodic param -> seamless tiling
    const f1 = rand(k * 7.13 + 11), f2 = rand(k * 3.77 + 5);
    const w1 = Math.sin(k / RIDGE_ROWS * Math.PI * 2);
    const w2 = Math.sin(k / RIDGE_ROWS * Math.PI * 6 + 1.7);
    const w3 = Math.sin(k / RIDGE_ROWS * Math.PI * 10 + 0.6);
    const bankH = 1.1 + 0.45 * w2 + f1 * 0.8;            // low snow bank
    const peakH = 5.4 + 2.1 * w1 + 1.3 * w3 + f2 * 2.1;  // jagged main crest
    const crestX = 8.1 + f1 * 1.5 + 0.7 * w2;            // crest meanders
    const m = 0.95 + f1 * 0.09;                           // per-row tint variation
    pos.push(side * 5.7, -0.6, z);                 C(0.62, 0.70, 0.79, m);  // buried foot
    pos.push(side * (6.9 + 0.5 * w3), bankH, z);   C(0.84, 0.90, 0.95, m);  // bank crest
    pos.push(side * crestX, peakH, z);             C(0.88 + peakH * 0.011, 0.91 + peakH * 0.008, 0.97, m); // snowy peak
    pos.push(side * 12.6, peakH * 0.45 + 0.7, z);  C(0.72, 0.79, 0.87, m);  // back slope
  }
  for (let i = 0; i < N; i++) {
    const a = i * 4;
    for (let j = 0; j < 3; j++) {
      idx.push(a + j, a + j + 1, a + 4 + j, a + j + 1, a + 5 + j, a + 4 + j);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
const ridgeMat = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true, side: THREE.DoubleSide });
const ridges = [new THREE.Mesh(buildRidgeGeo(-1), ridgeMat), new THREE.Mesh(buildRidgeGeo(1), ridgeMat)];
for (const r of ridges) scene.add(r);

// snow rocks on the shoulder between the outer lane and the wall (clear of both)
for (let i = 0; i < 22; i++) {
  const f = rand(i * 3.1 + 7);
  const s = 0.35 + f * 0.55;
  const t = new THREE.Mesh(new THREE.DodecahedronGeometry(s, 0), tuftMat);
  addScroller(t, (i % 2 ? 1 : -1) * (4.0 + f * 0.6), s * 0.45, -i * 12 - (i % 2) * 5);
}

// Falling snow — a single Points cloud around the camera (one draw call, cheap)
const SNOW_N = 450;
const SNOW = { x: 22, y: 30, near: 14, far: -94 };
const snowPos = new Float32Array(SNOW_N * 3);
for (let i = 0; i < SNOW_N; i++) {
  snowPos[i * 3] = (Math.random() * 2 - 1) * SNOW.x;
  snowPos[i * 3 + 1] = Math.random() * SNOW.y;
  snowPos[i * 3 + 2] = SNOW.far + Math.random() * (SNOW.near - SNOW.far);
}
const snowGeo = new THREE.BufferGeometry();
snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
const snow = new THREE.Points(snowGeo, new THREE.PointsMaterial({
  color: 0xffffff, size: 0.17, transparent: true, opacity: 0.85, depthWrite: false, sizeAttenuation: true, fog: true,
}));
scene.add(snow);

// ============================================================
// AT-ST player (viewed from behind; forward = -z)
// ============================================================
const METAL = new THREE.MeshLambertMaterial({ color: 0x9da1a8 });
const METAL_D = new THREE.MeshLambertMaterial({ color: 0x70747c });
const DARK = new THREE.MeshLambertMaterial({ color: 0x33373d });
const GUN = new THREE.MeshLambertMaterial({ color: 0x4a4e55 });

function buildATST() {
  const g = new THREE.Group();
  // command pod
  const pod = new THREE.Mesh(new THREE.BoxGeometry(1.9, 1.55, 1.7), METAL);
  pod.position.y = 2.65; g.add(pod);
  // back hatch (faces camera)
  const hatch = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.05, 0.12), METAL_D);
  hatch.position.set(0, 2.7, 0.86); g.add(hatch);
  const vent = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.18, 0.14), DARK);
  vent.position.set(0, 2.25, 0.9); g.add(vent);
  // top sensor
  const top = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.2, 0.5), METAL_D);
  top.position.set(0.4, 3.5, 0); g.add(top);
  const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 1.1, 6), GUN);
  ant.position.set(-0.6, 4.0, 0.3); g.add(ant);
  // side gun barrels (point forward -z)
  for (const sx of [-0.7, 0.7]) {
    const b = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 1.5, 8), GUN);
    b.rotation.x = Math.PI / 2; b.position.set(sx, 2.2, -1.1); g.add(b);
  }
  // chin gun
  const chin = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.5, 0.5), METAL_D);
  chin.position.set(0, 1.95, -0.95); g.add(chin);
  // neck
  const neck = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.5, 0.7), METAL_D);
  neck.position.set(0, 1.75, 0); g.add(neck);

  // legs (digitigrade, two angled segments + foot)
  const legs = new THREE.Group(); g.add(legs);
  for (const sx of [-0.55, 0.55]) {
    const leg = new THREE.Group();
    const thigh = new THREE.Mesh(new THREE.BoxGeometry(0.34, 1.2, 0.34), METAL);
    thigh.position.set(0, 1.15, -0.15); thigh.rotation.x = 0.5; leg.add(thigh);
    const shin = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.15, 0.3), METAL_D);
    shin.position.set(0, 0.5, 0.18); shin.rotation.x = -0.55; leg.add(shin);
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.22, 1.0), METAL);
    foot.position.set(0, 0.11, -0.05); leg.add(foot);
    leg.position.set(sx, 0, 0);
    leg.userData.phase = sx < 0 ? 0 : Math.PI;
    legs.add(leg);
  }
  g.userData.legs = legs;
  return g;
}
const player = buildATST();
player.position.set(LANE_X[1], 0, PLAYER_Z);
scene.add(player);

// ============================================================
// Laser bolts (pool)
// ============================================================
const boltGeo = new THREE.CylinderGeometry(0.09, 0.09, 1.6, 8);
boltGeo.rotateX(Math.PI / 2);
const boltMat = new THREE.MeshBasicMaterial({ color: 0xff3322 });
const bolts = [];
const boltPool = [];
function freeBolt(m) { scene.remove(m); boltPool.push(m); }
function fireBolt() {
  if (state !== STATE.PLAY) return;
  const now = clock.elapsedTime;
  if (now - lastShot < 0.22) return;
  lastShot = now;
  const shot = { spent: false };   // one trigger press destroys at most one X-wing
  for (const sx of [-0.7, 0.7]) {
    const m = boltPool.pop() || new THREE.Mesh(boltGeo, boltMat);
    m.visible = true;
    m.position.set(player.position.x + sx, 2.2, player.position.z - 1.6);
    m.userData.v = 150;
    m.userData.shot = shot;
    scene.add(m); bolts.push(m);
  }
  muzzleFlash();
}
let muzzle;
function muzzleFlash() {
  if (!muzzle) {
    muzzle = new THREE.PointLight(0xff5533, 0, 8);
    scene.add(muzzle);
  }
  muzzle.position.set(player.position.x, 2.2, player.position.z - 1.6);
  muzzle.intensity = 4;
}

// ============================================================
// Enemies + effects
// ============================================================
const enemies = [];
const fx = [];

const XW_BODY = new THREE.MeshLambertMaterial({ color: 0xe4e8ed });
const XW_GREY = new THREE.MeshLambertMaterial({ color: 0xb7bcc4 });
const XW_RED  = new THREE.MeshLambertMaterial({ color: 0xc0392b });
const XW_DARK = new THREE.MeshLambertMaterial({ color: 0x28323f });
const XW_GLASS = new THREE.MeshLambertMaterial({ color: 0x4d6f93 });
const ENGINE  = new THREE.MeshBasicMaterial({ color: 0xff8a44 });
const ROBE    = new THREE.MeshLambertMaterial({ color: 0x16171c });
const ROBE_HI = new THREE.MeshLambertMaterial({ color: 0x2b2d34 });
const SKIN_Y  = new THREE.MeshLambertMaterial({ color: 0x8aa15a });
const TAN     = new THREE.MeshLambertMaterial({ color: 0x8a7b5c });
const BLADE_B = new THREE.MeshBasicMaterial({ color: 0xbcd6ff });
const BLADE_G = new THREE.MeshBasicMaterial({ color: 0xbfffa0 });
const SKIN_H  = new THREE.MeshLambertMaterial({ color: 0xc9a47a });  // Jedi face
const TUNIC   = new THREE.MeshLambertMaterial({ color: 0x4a3a29 });  // Jedi under-tunic
const GLOVE   = new THREE.MeshLambertMaterial({ color: 0x2a2118 });  // gloves / boots / belt
const TAN_D   = new THREE.MeshLambertMaterial({ color: 0x5f523c });  // Yoda darker robe
const SKIN_YD = new THREE.MeshLambertMaterial({ color: 0x6d8348 });  // Yoda skin shadow
const HAIR    = new THREE.MeshLambertMaterial({ color: 0xe6e1d4 });  // Yoda wispy hair

// Shared geometries (built once) keep the per-X-wing mesh count low and cheap.
const XW_FUS = new THREE.CylinderGeometry(0.2, 0.26, 1.7, 8); XW_FUS.rotateX(Math.PI / 2);
const XW_NOSE = new THREE.ConeGeometry(0.2, 1.25, 8); XW_NOSE.rotateX(-Math.PI / 2);
const XW_NSTR = new THREE.CylinderGeometry(0.205, 0.225, 0.18, 8); XW_NSTR.rotateX(Math.PI / 2);
const XW_WING = new THREE.BoxGeometry(1.3, 0.06, 0.52);
const XW_TIP = new THREE.BoxGeometry(0.32, 0.08, 0.52);
const XW_CAN = new THREE.CylinderGeometry(0.04, 0.04, 2.1, 6); XW_CAN.rotateX(Math.PI / 2);
const XW_GLOW = new THREE.CircleGeometry(0.12, 8);
function buildXwing() {
  const g = new THREE.Group();
  const fus = new THREE.Mesh(XW_FUS, XW_BODY); g.add(fus);
  const nose = new THREE.Mesh(XW_NOSE, XW_BODY); nose.position.z = 1.45; g.add(nose);
  const nstripe = new THREE.Mesh(XW_NSTR, XW_RED); nstripe.position.z = 1.0; g.add(nstripe);
  const canopy = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.3, 0.8), XW_GLASS);
  canopy.position.set(0, 0.25, 0.28); canopy.rotation.x = -0.16; g.add(canopy);
  // four S-foils in an open X: wing + red tip + forward cannon + engine glow
  for (const [dx, dy] of [[1, 1], [-1, 1], [1, -1], [-1, -1]]) {
    const ang = Math.atan2(dy, dx);
    const wing = new THREE.Mesh(XW_WING, XW_BODY);
    wing.position.set(dx * 0.85, dy * 0.85, -0.3); wing.rotation.z = ang; g.add(wing);
    const tip = new THREE.Mesh(XW_TIP, XW_RED);
    tip.position.set(dx * 1.2, dy * 1.2, -0.3); tip.rotation.z = ang; g.add(tip);
    const can = new THREE.Mesh(XW_CAN, GUN);
    can.position.set(dx * 1.34, dy * 1.34, 0.5); g.add(can);
    const glow = new THREE.Mesh(XW_GLOW, ENGINE);
    glow.position.set(dx * 0.5, dy * 0.5, -0.92); glow.rotation.y = Math.PI; g.add(glow);
  }
  g.scale.setScalar(0.9);
  return g;
}

function buildJedi() {
  const g = new THREE.Group();
  // outer robe (wide at the hem) + a lighter under-tunic panel so it isn't a black blob
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.66, 1.7, 8), ROBE);
  body.position.y = 0.85; g.add(body);
  const tunic = new THREE.Mesh(new THREE.BoxGeometry(0.28, 1.0, 0.08), TUNIC);
  tunic.position.set(0, 1.05, 0.33); g.add(tunic);
  // belt + buckle
  const belt = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.52, 0.16, 8), GLOVE);
  belt.position.y = 0.98; g.add(belt);
  const buckle = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.1, 0.06), GUN);
  buckle.position.set(0, 0.98, 0.47); g.add(buckle);
  // cloak draping behind the shoulders
  const cape = new THREE.Mesh(new THREE.BoxGeometry(0.74, 1.7, 0.07), ROBE);
  cape.position.set(0, 0.95, -0.34); cape.rotation.x = 0.05; g.add(cape);
  // shoulders / cowl
  const sh = new THREE.Mesh(new THREE.CylinderGeometry(0.48, 0.4, 0.5, 8), ROBE_HI);
  sh.position.y = 1.72; g.add(sh);
  // hood + shadowed face + eyes
  const hood = new THREE.Mesh(new THREE.ConeGeometry(0.37, 0.66, 8), ROBE_HI);
  hood.position.y = 2.18; g.add(hood);
  const face = new THREE.Mesh(new THREE.SphereGeometry(0.17, 8, 7), SKIN_H);
  face.position.set(0, 2.02, 0.14); g.add(face);
  for (const sx of [-1, 1]) {
    const eye = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.04, 0.04), DARK);
    eye.position.set(sx * 0.06, 2.06, 0.29); g.add(eye);
  }
  // arms reaching to a two-handed grip in front + gloved hands
  for (const sx of [-1, 1]) {
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.08, 0.66, 6), ROBE);
    arm.position.set(sx * 0.24, 1.5, 0.3); arm.rotation.x = -0.95; arm.rotation.z = sx * 0.22; g.add(arm);
    const hand = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.12, 0.1), GLOVE);
    hand.position.set(sx * 0.09, 1.33, 0.52); g.add(hand);
  }
  // lightsaber — two-handed, blade up and slightly forward
  const hilt = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.34, 6), GUN);
  hilt.position.set(0, 1.4, 0.55); g.add(hilt);
  const blade = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.06, 1.7, 7), BLADE_B);
  blade.position.set(0, 2.45, 0.57); g.add(blade);
  // boots peeking from the hem
  for (const sx of [-1, 1]) {
    const boot = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.2, 0.34), GLOVE);
    boot.position.set(sx * 0.16, 0.1, 0.06); g.add(boot);
  }
  return g;
}

function buildYoda() {
  const g = new THREE.Group();
  // layered brown robe + collar
  const robe = new THREE.Mesh(new THREE.ConeGeometry(0.52, 1.0, 9), TAN);
  robe.position.y = 0.5; g.add(robe);
  const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.44, 0.34, 9), TAN_D);
  collar.position.y = 0.92; g.add(collar);
  for (const sx of [-1, 1]) {   // little green feet
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.12, 0.3), SKIN_YD);
    foot.position.set(sx * 0.17, 0.06, 0.1); g.add(foot);
  }
  // big head
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.37, 10, 8), SKIN_Y);
  head.position.y = 1.2; g.add(head);
  // long ears + wispy white hair tufts
  for (const sx of [-1, 1]) {
    const ear = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.62, 6), SKIN_Y);
    ear.position.set(sx * 0.42, 1.24, -0.04); ear.rotation.z = sx * 1.4; ear.rotation.x = -0.2; g.add(ear);
    const hair = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.06, 0.16), HAIR);
    hair.position.set(sx * 0.2, 1.45, -0.02); g.add(hair);
  }
  // eyes + brows
  for (const sx of [-1, 1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.085, 7, 6), DARK);
    eye.position.set(sx * 0.14, 1.18, 0.3); g.add(eye);
    const brow = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.045, 0.05), SKIN_YD);
    brow.position.set(sx * 0.14, 1.31, 0.31); brow.rotation.z = -sx * 0.32; g.add(brow);
  }
  // nose + mouth
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 5), SKIN_Y);
  nose.position.set(0, 1.08, 0.36); g.add(nose);
  const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.03, 0.04), DARK);
  mouth.position.set(0, 0.98, 0.34); g.add(mouth);
  // three-finger hand gripping the saber (held up to one side)
  const hand = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.1, 0.12), SKIN_Y);
  hand.position.set(0.2, 0.96, 0.42); g.add(hand);
  const hilt = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.26, 6), GUN);
  hilt.position.set(0.2, 1.06, 0.44); g.add(hilt);
  const blade = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.05, 1.15, 7), BLADE_G);
  blade.position.set(0.2, 1.73, 0.46); g.add(blade);
  return g;
}

// Object pools: meshes are reused instead of rebuilt, so geometry isn't
// allocated (and leaked) on every spawn — keeps the frame rate steady over a run.
const enemyPool = { xwing: [], jedi: [], yoda: [] };
function buildByType(type) { return type === 'xwing' ? buildXwing() : type === 'jedi' ? buildJedi() : buildYoda(); }
function spawnEnemy(type, laneIdx) {
  const mesh = enemyPool[type].pop() || buildByType(type);
  mesh.visible = true;
  mesh.rotation.set(0, 0, 0);
  mesh.position.set(LANE_X[laneIdx], type === 'xwing' ? 1.8 : 0, SPAWN_Z);
  scene.add(mesh);
  enemies.push({ type, mesh, lane: laneIdx, alive: true });
}
function releaseEnemy(e) { scene.remove(e.mesh); enemyPool[e.type].push(e.mesh); }
function pickType() { const r = Math.random(); return r < 0.45 ? 'xwing' : (r < 0.78 ? 'jedi' : 'yoda'); }
function spawnWave() {
  const order = [0, 1, 2];
  for (let i = 2; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = order[i]; order[i] = order[j]; order[j] = t; }
  const count = Math.random() < 0.3 ? 2 : 1;   // <=2 blocked => a free lane always exists
  for (let k = 0; k < count; k++) spawnEnemy(pickType(), order[k]);
}

const fxGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
const fxPool = [];
function burst(pos, color, n, spd, life) {
  for (let i = 0; i < n; i++) {
    const m = fxPool.pop() || new THREE.Mesh(fxGeo, new THREE.MeshBasicMaterial({ transparent: true }));
    m.material.color.setHex(color); m.material.opacity = 1; m.scale.setScalar(1); m.visible = true;
    m.position.copy(pos);
    scene.add(m);
    fx.push({ mesh: m, v: new THREE.Vector3((Math.random() - 0.5) * spd, Math.random() * spd, (Math.random() - 0.5) * spd), life, max: life });
  }
}
function releaseFx(m) { scene.remove(m); fxPool.push(m); }
function clearEnemies() { for (const e of enemies) releaseEnemy(e); enemies.length = 0; }
function clearFx() { for (const p of fx) releaseFx(p.mesh); fx.length = 0; }

// ============================================================
// Game state
// ============================================================
const STATE = { READY: 0, PLAY: 1, OVER: 2 };
let state = STATE.READY;
let lane = 1;                 // current target lane index
let speed = START_SPEED;
let distance = 0;
let highScore = +(localStorage.getItem('atst_assault_hi') || 0);
let lastShot = -1;
let bob = 0;
let spawnAccum = 0;
let spawnGap = 18;

const elScore = document.getElementById('score');
const elHi = document.getElementById('hi');
const elFinal = document.getElementById('finalScore');
const ovStart = document.getElementById('ovStart');
const ovOver = document.getElementById('ovOver');
elHi.textContent = highScore;

function startGame() {
  state = STATE.PLAY;
  lane = 1; speed = START_SPEED; distance = 0; lastShot = -1;
  spawnAccum = 0; spawnGap = 18;
  player.position.x = LANE_X[1];
  for (const b of bolts) freeBolt(b);
  bolts.length = 0;
  clearEnemies();
  clearFx();
  ovStart.classList.add('hidden');
  ovOver.classList.add('hidden');
}
function gameOver() {
  state = STATE.OVER;
  const d = Math.floor(distance);
  if (d > highScore) { highScore = d; localStorage.setItem('atst_assault_hi', String(d)); elHi.textContent = d; }
  elFinal.textContent = d;
  ovOver.classList.remove('hidden');
}
function primaryAction() {
  if (state === STATE.READY) startGame();
  else if (state === STATE.OVER) startGame();
  else fireBolt();
}
function moveLane(dir) {
  if (state !== STATE.PLAY) return;
  lane = Math.max(0, Math.min(2, lane + dir));
}

// ============================================================
// Input
// ============================================================
window.addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); moveLane(-1); }
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); moveLane(1); }
  else if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); primaryAction(); }
});

// touch: swipe to switch lanes, tap to fire/start
let tsx = null, tsy = null, swiped = false;
renderer.domElement.addEventListener('touchstart', (e) => {
  tsx = e.touches[0].clientX; tsy = e.touches[0].clientY; swiped = false;
}, { passive: true });
renderer.domElement.addEventListener('touchmove', (e) => {
  if (tsx == null) return;
  const dx = e.touches[0].clientX - tsx, dy = e.touches[0].clientY - tsy;
  if (!swiped && Math.abs(dx) > 34 && Math.abs(dx) > Math.abs(dy)) { moveLane(dx > 0 ? 1 : -1); swiped = true; }
}, { passive: true });
renderer.domElement.addEventListener('touchend', () => {
  if (!swiped) primaryAction();
  tsx = null;
});
// on-screen buttons
const bind = (id, fn) => {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); fn(); }, { passive: false });
  el.addEventListener('mousedown', (e) => { e.preventDefault(); fn(); });
};
bind('tleft', () => moveLane(-1));
bind('tright', () => moveLane(1));
bind('tfire', () => primaryAction());
if (matchMedia('(pointer: coarse)').matches) document.getElementById('touch').classList.add('show');

// The start / game-over overlays sit above the canvas, so a tap lands on them
// (not the canvas). Make tapping/clicking an overlay begin the run on mobile.
[ovStart, ovOver].forEach((ov) => {
  ov.addEventListener('touchstart', (e) => { e.preventDefault(); primaryAction(); }, { passive: false });
  ov.addEventListener('click', () => primaryAction());
});

// ============================================================
// Update + render
// ============================================================
const clock = new THREE.Clock();

function update(dt) {
  const t = clock.elapsedTime;

  // smooth, frame-rate-independent glide between lanes + a bank into the motion
  const targetX = LANE_X[lane];
  const prevX = player.position.x;
  player.position.x += (targetX - prevX) * (1 - Math.exp(-13 * dt));
  const vx = (player.position.x - prevX) / Math.max(dt, 1e-4);
  const targetBank = THREE.MathUtils.clamp(-vx * 0.05, -0.16, 0.16);
  player.userData.bank = (player.userData.bank || 0) + (targetBank - (player.userData.bank || 0)) * (1 - Math.exp(-10 * dt));

  if (state === STATE.PLAY) {
    if (speed < MAX_SPEED) speed += SPEED_RAMP * dt;
    distance += speed * dt * 0.1;
    elScore.textContent = Math.floor(distance);
  }
  bob += dt * (state === STATE.OVER ? 0 : (state === STATE.PLAY ? speed : START_SPEED)) * 0.5;

  // walker bob + leg swing
  player.position.y = Math.abs(Math.sin(bob)) * 0.12;
  player.userData.legs.children.forEach((leg) => { leg.rotation.x = Math.sin(bob + leg.userData.phase) * 0.25; });
  player.rotation.z = player.userData.bank + Math.sin(bob) * 0.012;

  // world scroll speed (frozen on game over)
  const move = (state === STATE.OVER ? 0 : (state === STATE.READY ? START_SPEED * 0.25 : speed)) * dt;

  for (const m of scrollers) {
    m.position.z += move;
    if (m.position.z > DESPAWN_Z) m.position.z -= GROUND_LEN;
  }

  // canyon ridges scroll with the world; the profile tiles every RIDGE_P units
  for (const w of ridges) {
    w.position.z += move;
    if (w.position.z > RIDGE_P) w.position.z -= RIDGE_P;
  }

  // falling snow: drift down + with the world, recycle around the camera
  const sp = snowGeo.attributes.position.array;
  for (let i = 0; i < SNOW_N; i++) {
    sp[i * 3 + 1] -= (3 + (i % 5)) * dt;
    sp[i * 3] += Math.sin(t * 0.6 + i) * 0.25 * dt;
    sp[i * 3 + 2] += move * 0.55;
    if (sp[i * 3 + 1] < 0 || sp[i * 3 + 2] > SNOW.near) {
      sp[i * 3 + 1] = SNOW.y;
      sp[i * 3 + 2] = SNOW.far + Math.random() * 12;
      sp[i * 3] = (Math.random() * 2 - 1) * SNOW.x;
    }
  }
  snowGeo.attributes.position.needsUpdate = true;

  // spawn waves
  if (state === STATE.PLAY) {
    spawnAccum += speed * dt;
    if (spawnAccum >= spawnGap) { spawnAccum -= spawnGap; spawnGap = 15 + Math.random() * 11; spawnWave(); }
  }

  // enemies: move, animate, collide with player
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.mesh.position.z += move;
    if (e.type === 'xwing') {
      e.mesh.position.y = 1.8 + Math.sin((t + i) * 4) * 0.1;
      e.mesh.rotation.z = Math.sin((t + i) * 2.5) * 0.18;
    }
    if (state === STATE.PLAY && e.alive &&
        Math.abs(e.mesh.position.z - PLAYER_Z) < 1.5 &&
        Math.abs(e.mesh.position.x - player.position.x) < 1.35) {
      gameOver();
    }
    if (e.mesh.position.z > DESPAWN_Z) { releaseEnemy(e); enemies.splice(i, 1); }
  }

  // bolts: move + resolve against the NEAREST overlapping enemy. A trigger
  // press destroys at most one X-wing (shared shot token); sabers deflect.
  for (let i = bolts.length - 1; i >= 0; i--) {
    const b = bolts[i];
    b.position.z -= b.userData.v * dt;
    let hit = -1, hitZ = -Infinity;
    for (let j = 0; j < enemies.length; j++) {
      const e = enemies[j];
      if (!e.alive) continue;
      if (Math.abs(b.position.z - e.mesh.position.z) < 1.6 && Math.abs(b.position.x - e.mesh.position.x) < 1.0
          && e.mesh.position.z > hitZ) { hitZ = e.mesh.position.z; hit = j; }
    }
    let consumed = false;
    if (hit >= 0) {
      const e = enemies[hit];
      if (e.type === 'xwing') {
        if (!b.userData.shot.spent) {          // only the first X-wing dies per shot
          b.userData.shot.spent = true;
          burst(e.mesh.position, 0xff8a44, 16, 9, 0.5);
          burst(e.mesh.position, 0xffd27a, 8, 5, 0.35);
          e.alive = false; releaseEnemy(e); enemies.splice(hit, 1);
          distance += 15;
        }
        consumed = true;                        // bolt is absorbed either way
      } else {
        burst(b.position, e.type === 'yoda' ? 0xbfffa0 : 0xbcd6ff, 6, 5, 0.25);
        consumed = true;                        // deflected off the saber
      }
    }
    if (consumed || b.position.z < SPAWN_Z) { freeBolt(b); bolts.splice(i, 1); }
  }

  // effects
  for (let i = fx.length - 1; i >= 0; i--) {
    const p = fx[i];
    p.life -= dt;
    if (p.life <= 0) { releaseFx(p.mesh); fx.splice(i, 1); continue; }
    p.v.y -= 18 * dt;
    p.mesh.position.addScaledVector(p.v, dt);
    const k = p.life / p.max;
    p.mesh.scale.setScalar(Math.max(0.05, k));
    p.mesh.material.opacity = k;
  }

  if (muzzle && muzzle.intensity > 0) muzzle.intensity = Math.max(0, muzzle.intensity - dt * 30);
}

// adaptive resolution: if the running average FPS is low, drop the render
// scale a notch (down to 0.6x) so weak GPUs stay smooth. Only ratchets down.
let perfT = 0, perfN = 0;
function frame() {
  const dt = Math.min(0.05, clock.getDelta());
  perfT += dt; perfN++;
  if (perfN >= 45) {
    const fps = perfN / perfT;
    if (fps < 50 && resScale > 0.6) {
      resScale = Math.max(0.6, resScale - 0.15);
      renderer.setPixelRatio(baseDPR * resScale);
    }
    perfT = 0; perfN = 0;
  }
  update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

renderer.render(scene, camera);   // first paint
clock.start();
frame();
</script>
</body>
